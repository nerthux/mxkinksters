# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
# Controls absolute URLs in sitemap.xml, RSS, robots.txt and Open Graph
# tags. Preview builds override it via `hugo --baseURL` (see build.sh).
baseURL = "https://www.mxkinksters.com/"
defaultContentLanguage = "es"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 70

buildDrafts = false
buildFuture = false

# Use git commit history for lastmod (powers showDateUpdated and sitemap <lastmod>).
# Requires full git history at build time (see note for CI/Cloudflare).
enableGitInfo = true

enableEmoji = true

[frontmatter]
  lastmod = [':git', 'lastmod', 'date', 'publishDate']

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'
  # Quality (1-100) applied when Hugo re-encodes processed images (JPEG/WebP).
  # Affects resized variants the theme generates from source images.
  quality = 82

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
